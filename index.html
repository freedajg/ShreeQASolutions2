<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drishti - Consulting CRM</title>
    <script>
      // Sets the theme before anything paints, so there's no flash of the wrong theme.
      // Same rules as src/lib/theme.ts: Light or Dark if chosen, the device's setting for
      // System, and Dark when nothing is saved.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('drishti-theme');
        } catch (e) {}
        var theme = pref === 'light' ? 'light' : 'dark';
        if (pref === 'system' && window.matchMedia) {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta
      name="description"
      content="Client, renewal radar, and pipeline manager with AI partner Drishti for CMMI and ISO process certification consulting."
    />
    <meta property="og:title" content="Drishti - Consulting CRM" />
    <meta
      property="og:description"
      content="Client, renewal radar, and pipeline manager with AI partner Drishti for CMMI and ISO process certification consulting."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </body>
</html>
